<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이메일(아이디) 찾기 · 벌크농부 클래스</title>
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/style.css?v=250811a">
</head>
<body>

<header id="siteHeader"></header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>이메일(아이디) 찾기</h1>

      <form id="findForm">
        <p class="sub">가입할 때 입력한 이름과 휴대폰 번호로 찾습니다.</p>
        <div class="field">
          <label for="fiName">이름</label>
          <input id="fiName" type="text" autocomplete="name" placeholder="홍길동" required>
        </div>
        <div class="field">
          <label for="fiPhone">휴대폰 번호</label>
          <input id="fiPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="13" required>
        </div>
        <div class="turnstile-box" id="findTurnstile"></div>
        <div class="auth-msg" id="fiMsg"></div>
        <button class="btn btn-green" type="submit" id="fiBtn">이메일 찾기</button>
        <p class="auth-alt"><a href="auth.html">로그인</a> · <a href="reset.html">비밀번호 재설정</a></p>
      </form>

      <!-- 결과 -->
      <div id="fiResult" style="display:none">
        <div class="find-result">
          <p class="fr-label">가입된 이메일</p>
          <p class="fr-email" id="frEmail"></p>
          <p class="fr-note">보안을 위해 일부만 표시합니다.</p>
        </div>
        <a class="btn btn-green" href="auth.html" style="margin-top:16px">로그인하러 가기</a>
      </div>

      <p class="mode-note" id="modeNote"></p>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=250811a"></script>
<script src="js/data.js?v=250811a"></script>
<script src="js/core.js?v=250811a"></script>
<script src="js/adapter-local.js?v=250811a"></script>
<script src="js/adapter-supabase.js?v=250811a"></script>
<script src="js/api.js?v=250811a"></script>
<script>
'use strict';
(function () {
  function setMsg(text, ok) { var el = $('#fiMsg'); el.textContent = text || ''; el.className = 'auth-msg ' + (ok ? 'ok' : 'err'); }

  API.init().then(function () {
    renderHeader('');
    renderFooter();
  });

  /* 휴대폰 자동 하이픈 */
  $('#fiPhone').addEventListener('input', function () {
    var v = this.value.replace(/[^0-9]/g, '').slice(0, 11);
    if (v.length > 7) v = v.replace(/(\d{3})(\d{4})(\d{1,4})/, '$1-$2-$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,4})/, '$1-$2');
    this.value = v;
  });

  /* ---------- Turnstile (봇 방지) ---------- */
  var TURNSTILE = (window.BULK_CONFIG && window.BULK_CONFIG.TURNSTILE_SITE_KEY || '').trim();
  var tsToken = '', tsId = null, tsLoadFailed = false;
  var TS_ERR = '보안 확인 위젯을 불러오지 못했습니다. 광고 차단(AdBlock)을 끄고 새로고침해주세요.';

  if (TURNSTILE) {
    var s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true; s.defer = true;
    s.onerror = function () { tsLoadFailed = true; $('#findTurnstile').innerHTML = '<div style="font-size:13px;color:#E03030;font-weight:700">' + TS_ERR + '</div>'; };
    s.onload = function () {
      if (!window.turnstile) { s.onerror(); return; }
      try {
        tsId = window.turnstile.render('#findTurnstile', {
          sitekey: TURNSTILE, theme: 'light', action: 'find-id',
          callback: function (t) { tsToken = t; },
          'expired-callback': function () { tsToken = ''; },
          'error-callback': function () { tsToken = ''; }
        });
      } catch (e) { s.onerror(); }
    };
    document.head.appendChild(s);
    setTimeout(function () { if (!window.turnstile && !tsLoadFailed) s.onerror(); }, 10000);
  }

  /* ---------- 조회 ---------- */
  $('#findForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('#fiName').value.trim();
    var phone = $('#fiPhone').value;
    var digits = phone.replace(/[^0-9]/g, '');
    if (name.length < 2) { setMsg('이름을 정확히 입력해주세요.'); return; }
    if (!/^01[016789][0-9]{7,8}$/.test(digits)) { setMsg('휴대폰 번호를 정확히 입력해주세요.'); return; }
    if (TURNSTILE) {
      if (tsLoadFailed) { setMsg(TS_ERR); return; }
      if (!tsToken) { setMsg('"로봇이 아닙니다" 확인을 완료해주세요.'); return; }
    }
    var btn = $('#fiBtn');
    btn.disabled = true;
    setMsg('');
    API.findEmail(name, phone).then(function (r) {
      tsToken = ''; if (window.turnstile && tsId !== null) { try { window.turnstile.reset(tsId); } catch (e) {} }
      if (!r.ok) { setMsg(r.msg); btn.disabled = false; return; }
      if (!r.found) {
        // 일치 여부를 흐리게 — 존재 노출 방지
        setMsg('입력하신 정보와 일치하는 계정을 찾지 못했습니다. 가입 정보를 다시 확인하거나, 문의는 인스타그램 @bulk_farmer DM으로 주세요.');
        btn.disabled = false;
        return;
      }
      $('#findForm').style.display = 'none';
      $('#frEmail').textContent = r.masked;
      $('#fiResult').style.display = '';
    }).catch(function (err) {
      console.error(err);
      setMsg('조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
