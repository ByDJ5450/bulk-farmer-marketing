<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 · 벌크농부 클래스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/style.css?v=250811a">
</head>
<body>

<header id="siteHeader"></header>

<main>
  <div class="container" id="page">
    <div class="empty-note" style="margin-top:60px">불러오는 중…</div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=250811a"></script>
<script src="js/data.js?v=250811a"></script>
<script src="js/core.js?v=250811a"></script>
<script src="js/adapter-local.js?v=250811a"></script>
<script src="js/adapter-supabase.js?v=250811a"></script>
<script src="js/api.js?v=250811a"></script>
<script>
'use strict';
(function () {
  var page = $('#page');

  API.init().then(function () {
    renderHeader('');
    renderFooter();

    var me = API.me();
    if (!me) {
      page.innerHTML = '<div class="empty-note" style="margin-top:60px">마이페이지는 로그인 후 이용할 수 있습니다.<br><br>' +
        '<button class="btn btn-green btn-sm" type="button" onclick="gotoLogin()">로그인 / 회원가입</button></div>';
      return null;
    }
    return Promise.all([API.courses(), API.myEnrollments(), API.posts()]);
  }).then(function (r) {
    if (!r) return;
    var courses = r[0], myEnr = r[1], posts = r[2];
    var me = API.me();

    var myCourses = courses.filter(function (c) { return myEnr.indexOf(c.id) >= 0; });
    return Promise.all(myCourses.map(function (c) { return API.myProgress(c.id); }))
      .then(function (progressList) {
        render(me, myCourses, progressList, posts);
      });
  }).catch(function (e) {
    console.error(e);
    page.innerHTML = '<div class="empty-note" style="margin-top:60px">데이터를 불러오지 못했습니다. 네트워크를 확인해주세요.</div>';
  });

  function isMine(p, me) {
    return p.authorId ? p.authorId === me.id : p.name === (me.nickname || me.name);
  }

  function render(me, myCourses, progressList, posts) {
    var myPosts = posts.filter(function (p) { return isMine(p, me); });

    /* 내 강의 */
    var coursesHTML = myCourses.length
      ? myCourses.map(function (c, i) {
          var total = lectureCount(c);
          var done = progressList[i].length;
          var pct = total ? Math.round(done / total * 100) : 0;
          var lectures = allLectures(c);
          // 이어서 볼 강의: 아직 완료 안 한 첫 강의
          var nextLec = null;
          for (var j = 0; j < lectures.length; j++) {
            if (progressList[i].indexOf(lectures[j].id) < 0) { nextLec = lectures[j]; break; }
          }
          var link = 'classroom.html?course=' + esc(c.id) + (nextLec ? '&lecture=' + esc(nextLec.id) : '');
          return '<div class="my-course">' +
            '<div class="mc-info"><strong>' + esc(c.title) + '</strong>' +
            '<div class="progress-bar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>' +
            '<span class="mc-meta">' + done + ' / ' + total + '강 완료 · ' + pct + '%' +
            (pct === 100 ? ' 🎉 수강 완료!' : (nextLec ? ' · 다음: ' + esc(nextLec.title) : '')) + '</span></div>' +
            '<a class="btn btn-green btn-sm" href="' + link + '">' + (pct === 100 ? '다시 보기' : (pct === 0 ? '학습 시작' : '이어서 학습')) + '</a>' +
            '</div>';
        }).join('')
      : '<div class="empty-note">아직 수강 중인 강의가 없습니다.<br><br><a class="btn btn-green btn-sm" href="index.html#courses">강의 보러 가기</a></div>';

    /* 내가 쓴 글 */
    var postsHTML = myPosts.length
      ? myPosts.map(function (p) {
          return '<a class="post-item" href="community.html?post=' + esc(p.id) + '">' +
            '<span class="cat-badge cat-' + esc(p.cat) + '">' + CAT_LABEL[p.cat] + '</span>' +
            '<span class="p-title">' + esc(p.title) + '</span>' +
            '<span class="p-meta">' + timeAgo(p.ts) +
            (p.comments.length ? ' · 💬 ' + p.comments.length : '') + '</span></a>';
        }).join('')
      : '<div class="empty-note">아직 쓴 글이 없습니다. 커뮤니티에 첫 글을 남겨보세요.</div>';

    page.innerHTML =
      '<div class="profile-card">' +
        '<div class="profile-avatar">' + esc((me.nickname || me.name).charAt(0)) + '</div>' +
        '<div class="profile-info">' +
          '<h1>' + esc(me.nickname || me.name) + (me.role === 'coach' ? ' <b class="coach-tag">코치</b>' : '') + '</h1>' +
          '<p>' + esc(me.email) + (me.joined ? ' · 가입일 ' + new Date(me.joined).toLocaleDateString('ko-KR') : '') + '</p>' +
          '<p>🪪 ' + esc(me.name) + ' <span style="color:var(--dim);font-size:12px">(실명 · 나만 보임)</span></p>' +
          (me.phone ? '<p>📱 ' + esc(me.phone) + '</p>' : '') +
        '</div>' +
        (me.role === 'coach' ? '<a class="btn btn-dark btn-sm" href="admin.html">관리자 페이지</a>' : '') +
      '</div>' +

      '<div class="admin-block">' +
        '<h2>내 강의 <span class="count-tag">' + myCourses.length + '</span></h2>' +
        '<div class="my-course-list">' + coursesHTML + '</div>' +
      '</div>' +

      '<div class="admin-block">' +
        '<h2>내가 쓴 글 <span class="count-tag">' + myPosts.length + '</span></h2>' +
        '<div class="post-list" style="margin-top:12px">' + postsHTML + '</div>' +
      '</div>' +

      '<div class="admin-block">' +
        '<h2>계정 설정</h2>' +
        '<div class="setting-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="newNick">닉네임 변경 (공개 표시)</label>' +
          '<input id="newNick" type="text" maxlength="20" value="' + esc(me.nickname || me.name) + '"></div>' +
          '<button class="btn btn-ghost btn-sm" id="nickBtn" type="button">변경</button>' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="newName">이름(실명) 변경</label>' +
          '<input id="newName" type="text" maxlength="20" value="' + esc(me.name) + '"></div>' +
          '<button class="btn btn-ghost btn-sm" id="nameBtn" type="button">변경</button>' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="newPhone">휴대폰 번호 변경</label>' +
          '<input id="newPhone" type="tel" inputmode="numeric" maxlength="13" placeholder="010-1234-5678" value="' + esc(me.phone || '') + '"></div>' +
          '<button class="btn btn-ghost btn-sm" id="phoneBtn" type="button">변경</button>' +
        '</div>' +
        '<div class="setting-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="newPw">비밀번호 변경 (8자+ · 대소문자·특수문자)</label>' +
          '<input id="newPw" type="password" autocomplete="new-password" placeholder="새 비밀번호"></div>' +
          '<button class="btn btn-ghost btn-sm" id="pwBtn" type="button">변경</button>' +
        '</div>' +
        '<p class="hint">닉네임은 글·댓글·후기에 공개 표시됩니다. 실명은 본인과 코치만 볼 수 있습니다.</p>' +
      '</div>' +

      '<div class="admin-block danger-zone">' +
        '<h2>회원 탈퇴</h2>' +
        '<p class="desc">탈퇴하면 계정과 수강·진도·작성글이 모두 삭제되며 되돌릴 수 없습니다.</p>' +
        '<button class="btn btn-danger btn-sm" id="deleteBtn" type="button">회원 탈퇴</button>' +
      '</div>';

    bind();
    initPwToggles(page);
    blockHangul($('#newPw'));   // 비밀번호에 한글 입력 차단
    nameFilter($('#newName'));  // 이름: 한글·영문만
  }

  function bind() {
    $('#nickBtn').addEventListener('click', function () {
      var nickname = $('#newNick').value.trim();
      var me = API.me();
      if (nickname === (me.nickname || me.name)) { toast('지금 닉네임과 같습니다.'); return; }
      var btn = $('#nickBtn');
      btn.disabled = true;
      API.updateNickname(nickname).then(function (r) {
        if (!r.ok) { toast(r.msg); btn.disabled = false; return; }
        toast('닉네임이 변경되었습니다: ' + nickname);
        updateUserChip();
        setTimeout(function () { location.reload(); }, 700);
      }).catch(function (e) {
        console.error(e);
        toast('변경에 실패했습니다. 다시 시도해주세요.');
        btn.disabled = false;
      });
    });

    $('#nameBtn').addEventListener('click', function () {
      var name = $('#newName').value.trim();
      var me = API.me();
      if (name === me.name) { toast('지금 실명과 같습니다.'); return; }
      var btn = $('#nameBtn');
      btn.disabled = true;
      API.updateName(name).then(function (r) {
        if (!r.ok) { toast(r.msg); btn.disabled = false; return; }
        toast('실명이 변경되었습니다.');
        setTimeout(function () { location.reload(); }, 700);
      }).catch(function (e) {
        console.error(e);
        toast('변경에 실패했습니다. 다시 시도해주세요.');
        btn.disabled = false;
      });
    });

    $('#pwBtn').addEventListener('click', function () {
      var pw = $('#newPw').value;
      var btn = $('#pwBtn');
      btn.disabled = true;
      API.updatePassword(pw).then(function (r) {
        if (!r.ok) { toast(r.msg); btn.disabled = false; return; }
        $('#newPw').value = '';
        toast('비밀번호가 변경되었습니다.');
        btn.disabled = false;
      }).catch(function (e) {
        console.error(e);
        toast('변경에 실패했습니다. 다시 시도해주세요.');
        btn.disabled = false;
      });
    });

    $('#phoneBtn').addEventListener('click', function () {
      var btn = $('#phoneBtn');
      btn.disabled = true;
      API.updatePhone($('#newPhone').value).then(function (r) {
        if (!r.ok) { toast(r.msg); btn.disabled = false; return; }
        $('#newPhone').value = r.phone;
        toast('휴대폰 번호가 변경되었습니다.');
        btn.disabled = false;
      }).catch(function (e) {
        console.error(e);
        toast('변경에 실패했습니다. 다시 시도해주세요.');
        btn.disabled = false;
      });
    });

    // 휴대폰 자동 하이픈
    $('#newPhone').addEventListener('input', function () {
      var d = this.value.replace(/[^0-9]/g, '').slice(0, 11);
      if (d.length >= 11) this.value = d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
      else if (d.length >= 7) this.value = d.replace(/(\d{3})(\d{3,4})/, '$1-$2');
      else this.value = d;
    });

    $('#deleteBtn').addEventListener('click', function () {
      if (!confirm('정말 탈퇴하시겠습니까?\n계정과 모든 데이터(수강·진도·작성글)가 삭제되며 되돌릴 수 없습니다.')) return;
      if (!confirm('마지막 확인입니다. 탈퇴를 진행할까요?')) return;
      var btn = $('#deleteBtn');
      btn.disabled = true;
      API.deleteAccount().then(function (r) {
        if (!r.ok) { toast(r.msg); btn.disabled = false; return; }
        alert('탈퇴가 완료되었습니다. 그동안 이용해주셔서 감사합니다.');
        location.href = 'index.html';
      }).catch(function (e) {
        console.error(e);
        toast('탈퇴 처리에 실패했습니다. 잠시 후 다시 시도해주세요.');
        btn.disabled = false;
      });
    });
  }
})();
</script>
</body>
</html>
